name: Compile Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
       - name: Configuring git environment.
         run: |
            git config --global user.name malkist01
            git config --global user.email aripujiyanto0812@gmail.com

       - name: Building Kernel.
         run: |
             git clone --depth 1 https://github.com/malkist01/kernel_xiaomi_ginkgo.git -b fifteen kernel
             cd kernel
             chmod 777 build.sh
             ./build.sh

       - name: Uploading ZIP.
         run: |
             cd kernel
             curl -T *.zip https://pixeldrain.com/api/file/ && echo ""
